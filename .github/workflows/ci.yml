name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  self-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TOI self-check
        shell: pwsh
        run: ./tests/self-check.ps1

      - name: Capture TOI self-check JSON
        shell: pwsh
        run: ./tests/self-check.ps1 -Json | Out-File -FilePath toi-self-check.json -Encoding utf8

      - name: Publish job summary
        shell: pwsh
        run: |
          $result = Get-Content -Raw -Path ./toi-self-check.json | ConvertFrom-Json
          "## TOI Self Check" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Checks: $($result.summary.checks)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Passed: $($result.summary.passed)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Failed: $($result.summary.failed)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "### Results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($check in $result.checks) {
            $status = if ($check.success) { "PASS" } else { "FAIL" }
            "- [$status] $($check.name): $($check.detail)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload TOI self-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: toi-self-check
          path: toi-self-check.json
