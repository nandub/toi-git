name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  self-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TOI self-check
        shell: pwsh
        run: ./tests/self-check.ps1

      - name: Capture TOI self-check JSON
        shell: pwsh
        run: |
          $selfCheck = & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/self-check.ps1 -Json
          $selfCheck | Out-File -FilePath toi-self-check.json -Encoding utf8

      - name: Capture TOI workflow report
        shell: pwsh
        run: |
          $report = & pwsh -NoProfile -ExecutionPolicy Bypass -File ./toi.ps1 report
          $report | Out-File -FilePath toi-report.md -Encoding utf8

      - name: Capture TOI workflow report JSON
        shell: pwsh
        run: |
          $reportJson = & pwsh -NoProfile -ExecutionPolicy Bypass -File ./toi.ps1 report -Json
          $reportJson | Out-File -FilePath toi-report.json -Encoding utf8

      - name: Capture TOI schema JSON
        shell: pwsh
        run: |
          $schema = & pwsh -NoProfile -ExecutionPolicy Bypass -File ./toi.ps1 schema -Json -Snapshot
          $schema | Out-File -FilePath toi-schema.json -Encoding utf8

      - name: Publish job summary
        shell: pwsh
        run: |
          Get-Content -Raw -Path ./toi-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload TOI self-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: toi-self-check
          path: toi-self-check.json

      - name: Upload TOI workflow report artifact
        uses: actions/upload-artifact@v4
        with:
          name: toi-workflow-report
          path: |
            toi-report.md
            toi-report.json

      - name: Upload TOI schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: toi-schema
          path: toi-schema.json
